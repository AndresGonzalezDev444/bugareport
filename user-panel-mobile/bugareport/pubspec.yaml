name: bugareport
description: "BugaReport - Plataforma ciudadana de reporte de incidentes para Guadalajara de Buga"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Supabase - Backend, Auth, Realtime, Storage
  supabase_flutter: ^2.8.4

  # Mapa OpenStreetMap
  flutter_map: ^8.1.1
  latlong2: ^0.9.1

  # Geolocalización y permisos de ubicación
  geolocator: ^13.0.2

  # Tipografías Montserrat + Inter
  google_fonts: ^6.2.1

  # Variables de entorno seguras
  flutter_dotenv: ^5.2.1
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon-app.jpg"
name: bugareport
description: "BugaReport - Plataforma ciudadana de reporte de incidentes para Guadalajara de Buga"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Supabase - Backend, Auth, Realtime, Storage
  supabase_flutter: ^2.8.4

  # Mapa OpenStreetMap
  flutter_map: ^8.1.1
  latlong2: ^0.9.1

  # Geolocalización y permisos de ubicación
  geolocator: ^13.0.2

  # Almacenamiento persistente (consentimiento legal, preferencias)
  shared_preferences: ^2.3.4

  # Almacenamiento seguro (token JWT de sesión)
  flutter_secure_storage: ^9.2.4

  # Renderizado de Markdown (documento legal offline)
  flutter_markdown_plus: ^1.0.12

  # Tipografías Montserrat + Inter
  google_fonts: ^6.2.1

  # Variables de entorno seguras
  flutter_dotenv: ^5.2.1
  flutter_launcher_icons: ^0.14.4

  # HU5 — Conectividad en tiempo real
  connectivity_plus: ^6.1.1

  # HU4 — Ajustes / Notificaciones locales
  flutter_local_notifications: ^19.0.3
  package_info_plus: ^8.2.1

  # HU6 — Reporte con foto (cámara, galería, compresión)
  image_picker: ^1.1.2
  image: ^4.5.3
  path: ^1.9.1

  # Abrir URLs externas (descarga de actualización)
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/legal/
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon-app.jpg"